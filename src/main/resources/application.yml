spring:
  application:
    name: cargo-metrics-ai
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

yandex:
  api:
    token: ${YANDEX_API_TOKEN}
    folder-id: ${YANDEX_FOLDER_ID}
